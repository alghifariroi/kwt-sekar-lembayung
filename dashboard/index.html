<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Keuangan KWT Sekar Lembayung</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='29' fill='none' stroke='%231f4d36' stroke-width='2.5'/%3E%3Cpath d='M32 52V27' stroke='%231f4d36' stroke-width='2.5' stroke-linecap='round'/%3E%3Cpath d='M32 44c-8 0-13-5-14-12 7 0 12 4 14 12z' fill='%231f4d36'/%3E%3Cpath d='M32 39c8 0 13-5 14-12-7 0-12 4-14 12z' fill='%231f4d36' opacity='.8'/%3E%3Ccircle cx='32' cy='16' r='6' fill='%238b6a9e'/%3E%3Ccircle cx='32' cy='16' r='2.6' fill='%23f2d48a'/%3E%3C/svg%3E">
  <style>
    html, body { margin: 0; height: 100%; background: #f6f8f3; overflow: hidden; font-family: system-ui, sans-serif; }
    iframe { display: block; width: 100%; height: 100vh; height: 100dvh; border: 0; }
    .muat { position: fixed; inset: 0; display: grid; place-items: center; color: #4b5a50; font-size: 15px; pointer-events: none; transition: opacity .3s; }
    .muat.selesai { opacity: 0; }
    .muat a { pointer-events: auto; color: #2a6146; }
  </style>
</head>
<body>
  <div class="muat" id="muat">
    <p>Memuat dashboard...<br><small>Bila tidak muncul, <a id="langsung" target="_blank" rel="noopener">buka di tab baru</a>.</small></p>
  </div>
  <iframe id="app" title="Dashboard keuangan KWT Sekar Lembayung" allow="clipboard-write"></iframe>

  <script>
    /* ===== Ganti dengan URL Web App Apps Script (diakhiri /exec) ===== */
    var URL_WEB_APP = 'https://script.google.com/macros/s/AKfycbwtigqQ7QIF7_7xSdUR75XRURPKDj87Gi1fyWrDN2cl-5q8ZKvgUuI3CWJTeTALniDb/exec';

    var f = document.getElementById('app');
    document.getElementById('langsung').href = URL_WEB_APP;
    f.onload = function () { document.getElementById('muat').className = 'muat selesai'; };
    f.src = URL_WEB_APP;
  </script>
</body>
</html>
